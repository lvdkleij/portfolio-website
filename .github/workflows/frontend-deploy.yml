name: Frontend Deploy

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-deploy.yml

jobs:
  frontend-deploy:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure weather secret
        env:
          METEOSOURCE_API_KEY: ${{ secrets.METEOSOURCE_API_KEY }}
        run: |
          if [[ -z "${METEOSOURCE_API_KEY}" ]]; then
            echo "::error::The METEOSOURCE_API_KEY production secret is not configured."
            exit 1
          fi

          az containerapp secret set \
            --name ca-portfolio-frontend-prod \
            --resource-group rg-portfolio-prod \
            --secrets "meteosource-api-key=${METEOSOURCE_API_KEY}" \
            --output none

      - name: Deploy image
        run: |
          az containerapp update \
            --name ca-portfolio-frontend-prod \
            --resource-group rg-portfolio-prod \
            --container-name frontend \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars \
              NUXT_METEOSOURCE_API_KEY=secretref:meteosource-api-key
