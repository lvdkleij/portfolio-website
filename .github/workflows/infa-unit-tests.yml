name: "Terraform Unit Tests"

on:
  pull_request:
    paths:
      - 'infrastructure/**'

permissions:
  contents: read

jobs:
  terraform-unit-tests:
    name: 'Terraform Unit Tests'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Init
        run: terraform -chdir=infrastructure init --backend=false
    
