name: Backend Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
  pull_request:
    paths:
      - .github/workflows/backend-unit-tests.yml
      - backend/**

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
